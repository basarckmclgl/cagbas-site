<main><section class="hero"><div class="wrap hero-inner"><div><span class="eyebrow">ÇAĞBAŞ / ÇALIŞMA SÜRECİMİZ</span><h1>Fikirden sonuca,<br><em>birlikte.</em></h1><p>Her başarılı dijital çözüm, doğru soruları sormakla başlar. İhtiyaçlarınızı anlamaktan tasarım ve geliştirmeye, test aşamasından yayına kadar her adımı planlı, şeffaf ve iş birliğine dayalı bir yaklaşımla yürütüyoruz.</p><div class="hero-actions"><a href="/bize-ulasin.html">Projeni Başlat ↗</a><a class="alt" href="/hizmetlerimiz.html">Hizmetlerimizi İncele</a></div></div><div class="hero-logo-wrap"><img src="/_assets/images/cagbas-logo.svg" alt="ÇAĞBAŞ Creative Studio"></div></div></section>
<section class="section"><div class="wrap"><div class="section-head"><span class="kicker">YAKLAŞIMIMIZ</span><h2>Sadece üretmiyor, doğru çözümü birlikte geliştiriyoruz.</h2><p>Her işletmenin hedefleri, ihtiyaçları ve çalışma biçimi farklıdır. Bu nedenle hazır kalıpları uygulamak yerine projenin ihtiyaçlarını analiz ediyor, doğru stratejiyi belirliyor ve her aşamada amaca uygun çözümler geliştiriyoruz.</p></div>
<div class="process-map" aria-label="Altı aşamalı çalışma süreci haritası"><svg class="route" viewBox="0 0 1000 590" preserveAspectRatio="none" aria-hidden="true"><path class="glow" d="M145 105 C300 15 420 45 500 115 S780 200 855 105 C960 250 950 370 855 475 C730 570 590 560 500 475 S240 385 145 475"/><path d="M145 105 C300 15 420 45 500 115 S780 200 855 105 C960 250 950 370 855 475 C730 570 590 560 500 475 S240 385 145 475"/></svg>
<div class="map-center"><img src="/_assets/images/cagbas-logo.svg" alt="ÇAĞBAŞ"><strong>PROJE YOLCULUĞU</strong></div>
<article class="process-stop"><span class="pin" data-n="01">⌕</span><h3>Keşif</h3><p>Sizi, markanızı ve hedeflerinizi tanıyoruz. Beklentilerinizi, mevcut durumunuzu ve projenin kapsamını birlikte değerlendiriyoruz.</p></article>
<article class="process-stop"><span class="pin" data-n="02">◈</span><h3>Analiz</h3><p>İhtiyaçları önceliklendiriyor, teknik ve yaratıcı gereksinimleri değerlendiriyor, projeniz için doğru yol haritasını oluşturuyoruz.</p></article>
<article class="process-stop"><span class="pin" data-n="03">▦</span><h3>Planlama</h3><p>İş kapsamını, teslim edilecek çalışmaları, öncelikleri ve çalışma takvimini belirliyor; beklentileri netleştiriyoruz.</p></article>
<article class="process-stop"><span class="pin" data-n="04">✧</span><h3>Tasarım ve Geliştirme</h3><p>Belirlenen yol haritasına göre tasarım ve geliştirme çalışmalarını yürütüyor, fikirleri işlevsel dijital çözümlere dönüştürüyoruz.</p></article>
<article class="process-stop"><span class="pin" data-n="05">✓</span><h3>Test ve Teslim</h3><p>Çalışmaları farklı cihazlarda ve kullanım senaryolarında kontrol ediyor, gerekli düzenlemeleri tamamlıyor ve onaylanan projeyi teslim ediyoruz.</p></article>
<article class="process-stop"><span class="pin" data-n="06">↗</span><h3>Destek ve İyileştirme</h3><p>Proje sonrasında ihtiyaç duyulan destek ve iyileştirme çalışmalarını değerlendiriyor, dijital çözümünüzün gelişimini sürdürüyoruz.</p></article>
<div class="map-end">✦ &nbsp; PROJE TESLİMİ</div></div></div></section>
<section class="section soft"><div class="wrap"><div class="section-head"><span class="kicker">ÇALIŞMA İLKELERİMİZ</span><h2>Her aşamada aynı yaklaşım.</h2></div><div class="principles">
<div class="principle"><i>◌</i><h3>Şeffaf İletişim</h3><p>Sürecin her aşamasında açık ve anlaşılır iletişim kuruyoruz.</p></div><div class="principle"><i>◎</i><h3>İhtiyaca Özel Çözümler</h3><p>Her projeyi kendi hedefleri ve gereksinimleri doğrultusunda ele alıyoruz.</p></div><div class="principle"><i>◇</i><h3>Kontrollü İlerleme</h3><p>Çalışmaları belirlenen kapsam ve onay adımlarıyla yürütüyoruz.</p></div><div class="principle"><i>↗</i><h3>Sürdürülebilir Yaklaşım</h3><p>Bugünün ihtiyaçları kadar gelecekteki gelişim olanaklarını da dikkate alıyoruz.</p></div></div></div></section>
<section class="wrap"><div class="bottom-cta"><h2>Birlikte başlayalım.</h2><p>Aklınızdaki fikri, işletmenizin ihtiyacını veya geliştirmek istediğiniz dijital projeyi bizimle paylaşın. Size uygun çalışma sürecini birlikte şekillendirelim.</p><a class="cta-btn" href="/bize-ulasin.html">Projenizi Konuşalım ↗</a></div></section></main>
