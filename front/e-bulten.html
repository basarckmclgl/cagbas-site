<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow">
<title>E-Bülten İşlemleri | ÇAĞBAŞ</title>
<meta name="description" content="ÇAĞBAŞ e-bülten aboneliğinizi yönetin veya abonelikten çıkın.">
<link rel="stylesheet" href="/_assets/css/style.css">
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f6f4f8;color:#24212b;font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}.nl-top{background:#111827;color:#fff;padding:22px max(22px,calc((100% - 1080px)/2));}.nl-top a{color:#fff;text-decoration:none;font-size:22px;letter-spacing:4px;font-weight:700}.nl-main{width:min(620px,calc(100% - 32px));margin:64px auto;flex:1}.nl-card{background:#fff;border:1px solid #e8e1ed;border-radius:18px;padding:clamp(24px,5vw,42px);box-shadow:0 16px 44px #21152a0c}.nl-kicker{color:#7952a6;letter-spacing:3px;font-size:12px;font-weight:700}.nl-card h1{font-size:clamp(26px,5vw,36px);margin:12px 0}.nl-card>p{color:#696271;line-height:1.7}.nl-card label{display:block;margin:22px 0 8px;color:#5d5664}.nl-card select,.nl-card input[type=email]{width:100%;min-height:54px;border:1px solid #d9d1e0;border-radius:8px;background:#fff;padding:12px 14px;font-size:16px;color:#24212b}.nl-card .checkbox-wrapper{display:flex;align-items:flex-start;gap:10px;margin:16px 0}.nl-card .checkbox-wrapper[hidden]{display:none!important}.nl-card .checkbox-wrapper input{width:19px;height:19px;flex:0 0 19px;margin-top:3px}.nl-card .checkbox-wrapper label{margin:0;line-height:1.55}.nl-submit{width:100%;min-height:56px;border:0;border-radius:8px;background:#7952a6;color:#fff;font-weight:700;letter-spacing:1px;font-size:15px;margin-top:18px;cursor:pointer}.nl-submit:disabled{opacity:.6}.newsletter-privacy{font-size:13px;line-height:1.6;color:#777;margin-top:16px}.newsletter-privacy a{color:#7952a6}.newsletter-feedback{min-height:24px;line-height:1.6;color:#5e3c83;margin-top:16px}.nl-back{display:inline-block;margin-top:22px;color:#7952a6;text-decoration:none}.nl-footer{text-align:center;background:#111827;color:#cbd2df;padding:20px;font-size:13px}
</style>
</head>
<body>
<header class="nl-top"><a href="/">ÇAĞBAŞ</a></header>
<main class="nl-main"><section class="nl-card">
<div class="nl-kicker">ÇAĞBAŞ CREATIVE STUDIO</div>
<h1>E-Bülten İşlemleri</h1>
<p>E-bülten aboneliğinizi başlatmak veya mevcut aboneliğinizi sonlandırmak için işlem seçin.</p>
<form id="newsletterForm" class="newsletter-form" novalidate>
<label for="newsletterAction">İşlem seçin</label>
<select id="newsletterAction" name="action" aria-label="İşlem seçin">
<option value="subscribe">Abone Ol</option>
<option value="unsubscribe">Abonelik İptali</option>
</select>
<label for="newsletterEmail">E-posta adresiniz</label>
<input type="email" id="newsletterEmail" name="email" placeholder="E-posta adresinizi girin" required maxlength="254" autocomplete="email">
<div class="checkbox-wrapper"><input type="checkbox" id="newsletterPrivacyConsent" required><label for="newsletterPrivacyConsent"> <a href="/yasal-bilgilendirme.html#kisisel-veriler" target="_blank" rel="noopener">Kişisel Verilerin Korunması Aydınlatma Metni</a>'ni okudum.</label></div>
<div class="checkbox-wrapper"><input type="checkbox" id="newsletterConsent" name="marketingConsent" value="yes" required><label for="newsletterConsent">E-bülten ve duyuru e-postaları almayı kabul ediyorum.</label></div>
<p class="newsletter-privacy">Abonelik iptali talebinde e-posta adresiniz yalnızca talebinizi doğrulamak için kullanılır.</p>
<button type="submit" class="nl-submit">ABONE OL</button>
<p class="newsletter-feedback" id="newsletterFeedback" role="status" aria-live="polite"></p>
</form>
<a class="nl-back" href="/">← Ana sayfaya dön</a>
</section></main>
<footer class="nl-footer">© 2026 ÇAĞBAŞ. Tüm hakları saklıdır.</footer>
<script src="/_assets/js/main.js" defer></script>
</body></html>
