<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow">
<title>E-Bülten İşlemleri | ÇAĞBAŞ</title>
<meta name="description" content="ÇAĞBAŞ e-bülten aboneliğinizi yönetin veya abonelikten çıkın.">

<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{width:100%;max-width:100%;min-height:100%;margin:0;padding:0;overflow-x:hidden}
body{background:#f6f4f8;color:#24212b;font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
.nl-top{width:100%;background:#111827;color:#fff;padding:20px max(20px,calc((100% - 1080px)/2))}
.nl-top a{color:#fff;text-decoration:none;font-size:22px;letter-spacing:4px;font-weight:700}
.nl-main{display:block;width:100%;max-width:680px;margin:36px auto;padding:0 18px;flex:1}
.nl-card{display:block;width:100%;max-width:100%;min-width:0;background:#fff;border:1px solid #e8e1ed;border-radius:18px;padding:clamp(22px,5vw,40px);box-shadow:0 16px 44px #21152a0c;overflow:hidden}
.nl-kicker{color:#7952a6;letter-spacing:3px;font-size:12px;font-weight:700;overflow-wrap:anywhere}
.nl-card h1{font-size:clamp(25px,6vw,36px);line-height:1.2;margin:12px 0 16px;overflow-wrap:anywhere}
.nl-card>p{color:#696271;line-height:1.65;margin:0 0 24px;overflow-wrap:anywhere}
.nl-card form{display:block;width:100%;max-width:100%;min-width:0;margin:0}
.nl-card form>label{display:block;width:100%;margin:18px 0 8px;color:#5d5664;font-size:16px;line-height:1.4}
.nl-card select,.nl-card input[type=email]{display:block;width:100%;max-width:100%;min-width:0;min-height:54px;border:1px solid #d9d1e0;border-radius:8px;background:#fff;padding:12px 14px;font-size:16px;color:#24212b;margin:0}
.nl-card .checkbox-wrapper{display:flex!important;flex-direction:row!important;align-items:flex-start!important;justify-content:flex-start!important;gap:11px!important;width:100%!important;max-width:100%!important;min-width:0!important;margin:18px 0!important;padding:0!important;float:none!important;position:static!important;clear:both!important}
.nl-card .checkbox-wrapper[hidden]{display:none!important}
.nl-card .checkbox-wrapper input[type=checkbox]{display:block!important;appearance:auto!important;-webkit-appearance:checkbox!important;position:static!important;inset:auto!important;float:none!important;flex:0 0 20px!important;width:20px!important;min-width:20px!important;max-width:20px!important;height:20px!important;min-height:20px!important;margin:2px 0 0!important;padding:0!important;opacity:1!important;transform:none!important}
.nl-card .checkbox-wrapper label{display:block!important;position:static!important;flex:1 1 auto!important;width:auto!important;min-width:0!important;max-width:100%!important;margin:0!important;padding:0!important;float:none!important;line-height:1.55!important;white-space:normal!important;overflow-wrap:anywhere!important;color:#4f4857!important;font-size:14px!important}
.nl-card .checkbox-wrapper label a{color:#7952a6;text-decoration:underline}
.nl-card .newsletter-privacy{display:block;width:100%;font-size:13px;line-height:1.6;color:#777;margin:18px 0 0;overflow-wrap:anywhere}
.nl-submit{display:block;width:100%;max-width:100%;min-height:54px;border:0;border-radius:8px;background:#7952a6;color:#fff;font-weight:700;letter-spacing:1px;font-size:15px;margin:20px 0 0;padding:12px;cursor:pointer}
.nl-submit:disabled{opacity:.6}
.newsletter-feedback{display:block;width:100%;min-height:24px;line-height:1.6;color:#5e3c83;margin:14px 0 0;overflow-wrap:anywhere}
.nl-back{display:inline-block;max-width:100%;margin-top:22px;color:#7952a6;text-decoration:none;overflow-wrap:anywhere}
.nl-footer{width:100%;text-align:center;background:#111827;color:#cbd2df;padding:18px;font-size:13px}
[dir=rtl] .nl-card{text-align:right}
@media(max-width:480px){.nl-main{margin:18px auto;padding:0 12px}.nl-card{padding:22px 18px;border-radius:14px}.nl-top{padding:18px 20px}.nl-card .checkbox-wrapper{gap:9px!important}.nl-card .checkbox-wrapper label{font-size:13px!important}}
</style>
</head>
<body>
<header class="nl-top"><a href="/">ÇAĞBAŞ</a></header>
<main class="nl-main"><section class="nl-card">
<div class="nl-kicker">ÇAĞBAŞ CREATIVE STUDIO</div>
<h1>E-Bülten İşlemleri</h1>
<p>E-bülten aboneliğinizi başlatmak veya mevcut aboneliğinizi sonlandırmak için işlem seçin.</p>
<form id="newsletterForm" class="newsletter-form" novalidate>
<label for="newsletterAction">İşlem seçin</label>
<select id="newsletterAction" name="action" aria-label="İşlem seçin">
<option value="subscribe">Abone Ol</option>
<option value="unsubscribe">Abonelik İptali</option>
</select>
<label for="newsletterEmail">E-posta adresiniz</label>
<input type="email" id="newsletterEmail" name="email" placeholder="E-posta adresinizi girin" required maxlength="254" autocomplete="email">
<div class="checkbox-wrapper"><input type="checkbox" id="newsletterPrivacyConsent" required><label for="newsletterPrivacyConsent"> <a href="/yasal-bilgilendirme.html#kisisel-veriler" target="_blank" rel="noopener">Kişisel Verilerin Korunması Aydınlatma Metni</a>’ni okudum.</label></div>
<div class="checkbox-wrapper"><input type="checkbox" id="newsletterConsent" name="marketingConsent" value="yes" required><label for="newsletterConsent">E-bülten ve duyuru e-postaları almayı kabul ediyorum.</label></div>
<p class="newsletter-privacy">Abonelik iptali talebinde e-posta adresiniz yalnızca talebinizi doğrulamak için kullanılır.</p>
<button type="submit" class="nl-submit">ABONE OL</button>
<p class="newsletter-feedback" id="newsletterFeedback" role="status" aria-live="polite"></p>
</form>
<a class="nl-back" href="/">← Ana sayfaya dön</a>
</section></main>
<footer class="nl-footer">© 2026 ÇAĞBAŞ. Tüm hakları saklıdır.</footer>
<script>
(function(){
 const form=document.getElementById('newsletterForm'); if(!form) return;
 const action=document.getElementById('newsletterAction');
 const email=document.getElementById('newsletterEmail');
 const button=form.querySelector('button[type="submit"]');
 const feedback=document.getElementById('newsletterFeedback');
 const boxes=Array.from(form.querySelectorAll('.checkbox-wrapper'));
 const checks=boxes.map(x=>x.querySelector('input[type="checkbox"]')).filter(Boolean);
 function setMode(){
  const subscribing=action.value==='subscribe';
  boxes.forEach((box,i)=>{box.hidden=!subscribing;box.style.display=subscribing?'flex':'none';});
  checks.forEach(ch=>{ch.required=subscribing;if(!subscribing)ch.checked=false;});
  button.textContent=subscribing?'ABONE OL':'ABONELİK İPTALİ';
  feedback.textContent='';
 }
 action.addEventListener('change',setMode);setMode();
 form.addEventListener('submit',async function(e){
  e.preventDefault();
  if(!email.value.trim()||!email.checkValidity()){feedback.textContent='Lütfen geçerli bir e-posta adresi girin.';email.focus();return;}
  const subscribing=action.value==='subscribe';
  if(subscribing&&checks.some(ch=>!ch.checked)){feedback.textContent='Lütfen KVKK bilgilendirmesini ve e-bülten gönderim onayını işaretleyin.';return;}
  const old=button.textContent;button.disabled=true;button.textContent='İsteğiniz gönderiliyor…';feedback.textContent='İsteğiniz gönderiliyor…';
  try{
   const response=await fetch('/api/newsletter',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),action:action.value,marketingConsent:subscribing&&!!checks[checks.length-1]?.checked})});
   let result={};try{result=await response.json();}catch(_){}
   if(!response.ok)throw new Error(result.error||'İşleminiz şu anda tamamlanamadı. Lütfen tekrar deneyin.');
   form.reset();setMode();feedback.textContent=result.message||'İşleminiz şu anda tamamlanamadı. Lütfen tekrar deneyin.';
  }catch(err){feedback.textContent=err.message||'İşleminiz şu anda tamamlanamadı. Lütfen tekrar deneyin.';}
  finally{button.disabled=false;button.textContent=old;setMode();}
 });
})();
</script>
</body></html>
