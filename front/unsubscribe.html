<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abonelikten Çık</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }
        .container {
            text-align: center;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .message {
            margin-top: 20px;
        }
        h1 {
            color: #4CAF50;
        }
        p {
            color: #555555;
            font-size: 16px;
        }
        .spinner {
            border: 8px solid #f3f3f3;
            border-radius: 50%;
            border-top: 8px solid #4CAF50;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <div id="unsubscribeMessage" class="message">
            <h1>Abonelikten çıkma işlemi gerçekleştiriliyor...</h1>
            <p>Lütfen bekleyin, işlem tamamlandığında bu sayfa otomatik olarak kapanacaktır.</p>
        </div>
    </div>

    <script src="_assets/js/unsubscribe.js"></script>
</body>
</html>
