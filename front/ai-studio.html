<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebStudio Pro — Profesyonel Görsel Web Tasarım Oluşturucu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600;700;800;900&family=Montserrat:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-workspace: #e5e7eb;
      --bg-panel: #ffffff;
      --bg-rail: #14151a;
      --bg-sub: #f3f4f6;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
    }

    html.dark {
      --bg-workspace: #0b0d12;
      --bg-panel: #151821;
      --bg-rail: #0e1016;
      --bg-sub: #1e222d;
      --border-color: #2a2f3d;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #818cf8;
      --accent-hover: #6366f1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-workspace);
      color: var(--text-main);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    .panel-bg { background-color: var(--bg-panel); }
    .sub-bg { background-color: var(--bg-sub); }
    .workspace-bg { background-color: var(--bg-workspace); }
    .border-theme { border-color: var(--border-color); }
    .text-theme { color: var(--text-main); }
    .text-muted-theme { color: var(--text-muted); }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.35); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.55); }

    .studio-header-bar {
      background: linear-gradient(90deg, #0ea5e9 0%, #6366f1 50%, #9333ea 100%);
    }

    /* Web Canvas Selection & Hover Outlines */
    .wb-node {
      position: relative;
      transition: outline 0.1s ease;
    }

    body:not(.preview-mode) .wb-node:hover {
      outline: 1.5px dashed rgba(99, 102, 241, 0.65);
      outline-offset: -1px;
    }

    body:not(.preview-mode) .wb-node.wb-selected {
      outline: 2px solid #6366f1 !important;
      outline-offset: -2px;
    }

    body:not(.preview-mode) .wb-section.wb-selected {
      outline: 2px solid #ec4899 !important;
      outline-offset: -2px;
    }

    /* Node Tag Badge & Quick Action Pill */
    .wb-badge {
      position: absolute;
      top: -22px;
      left: 0;
      background: #6366f1;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 5px 5px 0 0;
      z-index: 60;
      display: none;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .wb-section > .wb-badge {
      top: 0;
      left: 0;
      border-radius: 0 0 6px 0;
      background: #ec4899;
    }

    body:not(.preview-mode) .wb-node.wb-selected > .wb-badge {
      display: inline-flex;
    }

    /* Inline Text Editor */
    .wb-editing-text {
      outline: 2px solid #10b981 !important;
      background: rgba(16, 185, 129, 0.06);
      cursor: text !important;
    }

    /* Drag & Drop Insertion Indicator */
    .drop-target-active {
      box-shadow: inset 0 0 0 3px #10b981 !important;
      background-color: rgba(16, 185, 129, 0.06) !important;
    }

    /* Box Model Interactive Diagram */
    .box-model-margin {
      border: 1.5px dashed #f59e0b;
      background: rgba(245, 158, 11, 0.08);
    }
    .box-model-padding {
      border: 1.5px dashed #10b981;
      background: rgba(16, 185, 129, 0.08);
    }

    /* Genişletilmiş Menü Modları */
    .drawer-expanded {
      width: 500px !important;
      max-width: 45vw;
    }
    .inspector-expanded {
      width: 520px !important;
      max-width: 46vw;
    }

    /* Ok Tuşlarıyla Akıcı Gizleme / Gösterme Geçişleri */
    .panel-smooth-transition {
      transition: width 0.24s cubic-bezier(0.22, 1, 0.36, 1),
                  min-width 0.24s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.18s ease,
                  transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .panel-collapsed-left {
      width: 0px !important;
      min-width: 0px !important;
      opacity: 0;
      overflow: hidden;
      border-right-width: 0 !important;
      pointer-events: none;
    }

    .panel-collapsed-right {
      width: 0px !important;
      min-width: 0px !important;
      opacity: 0;
      overflow: hidden;
      border-left-width: 0 !important;
      pointer-events: none;
    }

    /* Preview Mode Adjustments */
    body.preview-mode .edit-only-ui {
      display: none !important;
    }
  </style>
</head>
<body class="flex flex-col h-screen w-screen overflow-hidden">

  <!-- =====================================================================
       1. ÜST ARAÇ ÇUBUĞU (TOP HEADER BAR)
       ===================================================================== -->
  <header class="h-14 studio-header-bar text-white flex items-center justify-between px-3 shadow-md z-50 shrink-0 gap-2">
    <!-- Sol: Logo, Dosya, Çoklu Sayfa Yöneticisi, Geri/İleri Al -->
    <div class="flex items-center gap-2 shrink-0">
      <div class="flex items-center gap-2 font-extrabold text-base tracking-tight px-2.5 py-1 rounded-lg bg-white/15 backdrop-blur-xs">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/></svg>
        <span class="hidden sm:inline">WebStudio Pro</span>
      </div>

      <!-- Dosya & Proje Menüsü -->
      <div class="relative edit-only-ui">
        <button id="btn-file-menu" class="px-2.5 py-1.5 rounded-lg hover:bg-white/15 text-xs font-semibold flex items-center gap-1 transition">
          <span>Proje</span>
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div id="dropdown-file-menu" class="hidden absolute left-0 mt-2 w-64 panel-bg text-theme rounded-xl shadow-2xl border border-theme py-1.5 z-50 text-xs">
          <button onclick="createBlankSite()" class="w-full text-left px-4 py-2 hover:bg-indigo-500/10 font-semibold text-indigo-600 dark:text-indigo-400">+ Boş Web Sitesi Başlat</button>
          <button onclick="openPageSettingsModal()" class="w-full text-left px-4 py-2 hover:bg-indigo-500/10">Sayfa SEO & URL Slug Ayarları</button>
          <div class="my-1 border-t border-theme"></div>
          <button onclick="exportProjectJSON()" class="w-full text-left px-4 py-2 hover:bg-indigo-500/10 flex items-center gap-2">
            <span>💾 Projeyi .JSON Olarak Kaydet</span>
          </button>
          <label class="w-full text-left px-4 py-2 hover:bg-indigo-500/10 flex items-center gap-2 cursor-pointer">
            <span>📂 .JSON Proje Dosyası Yükle</span>
            <input type="file" accept=".json" class="hidden" onchange="importProjectJSON(event)" />
          </label>
        </div>
      </div>

      <!-- Çoklu Sayfa Seçici -->
      <div class="relative flex items-center bg-black/20 rounded-lg px-2 py-1 text-xs">
        <span class="opacity-75 mr-1.5 hidden md:inline">Sayfa:</span>
        <select id="page-selector" onchange="switchPage(this.value)" class="bg-transparent font-bold outline-none cursor-pointer pr-1 text-white">
          <option value="0" class="text-gray-900">Ana Sayfa (/)</option>
        </select>
        <button onclick="openAddPageModal()" title="Yeni Sayfa Ekle" class="ml-1.5 w-5 h-5 rounded bg-white/20 hover:bg-white/30 flex items-center justify-center font-bold edit-only-ui">+</button>
      </div>

      <!-- Undo / Redo -->
      <div class="hidden lg:flex items-center gap-0.5 edit-only-ui">
        <button id="btn-undo" onclick="undo()" title="Geri Al (Ctrl+Z)" class="p-1.5 rounded-lg hover:bg-white/15 disabled:opacity-40">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M3 10h10a5 5 0 015 5v2M3 10l6-6M3 10l6 6"/></svg>
        </button>
        <button id="btn-redo" onclick="redo()" title="İleri Al (Ctrl+Y)" class="p-1.5 rounded-lg hover:bg-white/15 disabled:opacity-40">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M21 10H11a5 5 0 00-5 5v2M21 10l-6-6M21 10l-6 6"/></svg>
        </button>
      </div>
    </div>

    <!-- Orta: Responsive Ekran Boyutu Seçici (Desktop 1440 / Tablet 768 / Mobile 375) -->
    <div class="flex items-center bg-black/25 p-1 rounded-xl gap-1">
      <button onclick="setViewport('desktop')" data-vp="desktop" class="vp-btn bg-white text-indigo-700 px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1.5 transition" title="Masaüstü (1440px)">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        <span class="hidden xl:inline">1440px</span>
      </button>
      <button onclick="setViewport('tablet')" data-vp="tablet" class="vp-btn text-white/85 hover:bg-white/15 px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1.5 transition" title="Tablet (768px)">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
        <span class="hidden xl:inline">768px</span>
      </button>
      <button onclick="setViewport('mobile')" data-vp="mobile" class="vp-btn text-white/85 hover:bg-white/15 px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1.5 transition" title="Mobil (375px)">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
        <span class="hidden xl:inline">375px</span>
      </button>
    </div>

    <!-- Sağ: Tema, Canlı Önizleme (Preview), Kodu Gör & İndir -->
    <div class="flex items-center gap-2 shrink-0">
      <button onclick="toggleTheme()" title="Koyu / Açık Tema" class="p-2 rounded-lg bg-white/15 hover:bg-white/25 transition">
        <svg id="icon-moon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        <svg id="icon-sun" class="w-4 h-4 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>

      <button id="btn-preview-mode" onclick="togglePreviewMode()" class="px-3 py-1.5 rounded-lg bg-white/15 hover:bg-white/25 text-xs font-bold flex items-center gap-1.5 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <span id="preview-btn-text">Önizle</span>
      </button>

      <button onclick="openCodeExportModal()" class="px-3 py-1.5 rounded-lg bg-gray-900/80 hover:bg-gray-900 text-white text-xs font-bold flex items-center gap-1.5 transition edit-only-ui">
        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        <span class="hidden sm:inline">Kodu Gör</span>
      </button>

      <!-- Ok Tuşu Kısayol Bilgi Rozeti -->
      <div id="arrow-shortcut-badge" title="Sol menü için ←, Sağ menü için → ok tuşunu kullanın" class="hidden xl:flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-black/25 text-[11px] font-semibold text-white/95 select-none edit-only-ui">
        <kbd class="px-1.5 py-0.5 rounded bg-white/20 text-[10px] font-mono">←</kbd>
        <span>Sol</span>
        <span class="opacity-50">/</span>
        <kbd class="px-1.5 py-0.5 rounded bg-white/20 text-[10px] font-mono">→</kbd>
        <span>Sağ</span>
      </div>

      <button onclick="downloadFullHTML()" class="bg-white text-indigo-700 hover:bg-gray-100 font-extrabold text-xs px-3.5 py-1.5 rounded-lg shadow flex items-center gap-1.5 transition edit-only-ui">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        <span>HTML İndir</span>
      </button>
    </div>
  </header>

  <!-- =====================================================================
       2. ANA STÜDYO GÖVDESİ (SOL PANEL + ORTA WEB KANVAS + SAĞ INSPECTOR)
       ===================================================================== -->
  <div class="flex flex-1 overflow-hidden relative">

    <!-- SOL İKON RAYI (GENİŞLETİLMİŞ & OKUNAKLI) -->
    <aside class="w-20 bg-[#14151a] text-gray-300 flex flex-col items-center py-3 gap-2 shrink-0 z-40 select-none edit-only-ui">
      <button onclick="selectLeftTab('sections')" data-ltab="sections" class="ltab-btn w-[70px] py-3 rounded-xl flex flex-col items-center gap-1.5 text-[11px] font-semibold bg-white/15 text-white transition">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="6" rx="1.5"/><rect x="3" y="13" width="18" height="8" rx="1.5"/></svg>
        <span>Bölümler</span>
      </button>

      <button onclick="selectLeftTab('elements')" data-ltab="elements" class="ltab-btn w-[70px] py-3 rounded-xl flex flex-col items-center gap-1.5 text-[11px] font-semibold hover:text-white transition">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" view
      </button>

      <!-- Sol Menü Ok Tuşu Kısayol Göstergesi -->
      <button onclick="toggleLeftPanel()" title="Sol Menüyü Gizle / Göster (← / →)" class="mt-auto w-[70px] py-2 rounded-xl bg-white/5 hover:bg-white/15 text-[10px] font-semibold flex flex-col items-center gap-1 transition">
        <span class="font-mono text-xs text-indigo-300">← / →</span>
        <span>Menü</span>
      </button>
    </aside>

    <!-- GENİŞ SOL ÇEKMECE (BÖLÜMLER, BİLEŞENLER, METİN, MEDYA, KATMANLAR) -->
    <section id="left-drawer" class="w-[380px] panel-bg border-r border-theme flex flex-col shrink-0 z-30 panel-smooth-transition edit-only-ui">
      <div class="p-3.5 border-b border-theme flex items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <h2 id="left-drawer-title" class="font-extrabold text-sm tracking-tight">Hazır Web Bölümleri</h2>
          <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-indigo-500/10 text-indigo-500 font-bold" title="Sol ok tuşu ile gizle, sağ ok tuşu ile aç">← / →</span>
        </div>
        <div class="flex items-center gap-1">
          <button onclick="toggleLeftDrawerWidth()" title="Sol Menüyü Genişlet / Daralt" class="px-2 py-1 rounded-lg sub-bg hover:bg-indigo-500/15 text-[11px] font-bold transition">⤢</button>
          <button onclick="toggleLeftPanel(false)" title="Sol Menüyü Gizle (←)" class="px-2 py-1 rounded-lg sub-bg hover:bg-rose-500/15 hover:text-rose-500 text-[11px] font-bold transition">✕</button>
        </div>
      </div>
      <div id="left-drawer-content" class="flex-1 overflow-y-auto p-3.5 space-y-4"></div>
    </section>

    <!-- Sol Menü Kapalıyken Görünür Hızlı Açma Butonu -->
    <button id="reopen-left-panel-btn" onclick="toggleLeftPanel(true)" title="Sol Menüyü Göster (→)" class="hidden fixed left-24 top-16 z-40 px-2.5 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow-lg items-center gap-1.5 transition edit-only-ui">
      <span class="font-mono">→</span>
      <span>Sol Menü</span>
    </button>

    <!-- ORTA WEB TASARIM KANVASI -->
    <main id="canvas-workspace" class="flex-1 workspace-bg overflow-auto flex flex-col items-center py-6 px-4 relative">
