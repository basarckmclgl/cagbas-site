<?xml version="1.0" encoding="UTF-8"?>
<svg width="200px" height="200px" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Arka Plan -->
    <rect width="100%" height="50" y="10" fill="rgba(240, 240, 240, 0.6)"/>

    <!-- Dünya Küresi -->
    <circle cx="100" cy="100" r="60" fill="#00aaff" stroke="#0077cc" stroke-width="4"/>

    <!-- Dünya Meridyenleri ve Paraleleleri -->
    <line x1="100" y1="40" x2="100" y2="160" stroke="#ffffff" stroke-width="2"/>
    <path d="M40,100 A60,60 0 0,1 160,100" stroke="#ffffff" stroke-width="2" fill="none"/>
    <path d="M40,100 A60,60 0 0,0 160,100" stroke="#ffffff" stroke-width="2" fill="none"/>

    <!-- Oklar -->
    <path d="M160,100 L180,80 L170,100 L180,120 Z" fill="#ff5733"/>
    <path d="M40,100 L20,80 L30,100 L20,120 Z" fill="#ff5733"/>
    <path d="M100,40 L120,20 L100,30 L80,20 Z" fill="#ff5733"/>
    <path d="M100,160 L120,180 L100,170 L80,180 Z" fill="#ff5733"/>

    <!-- Ticaret Sembolü -->
    <text x="100" y="190" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">Global Trade</text>
</svg>
